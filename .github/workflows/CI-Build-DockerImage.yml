name: CI Build .NET Core API with Docker

on:
  push:
    branches:
      - Development
      
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest #windows-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      # Step 3: Restore packages
      - name: Restore packages
        run: dotnet restore

      # Step 4: Build project
      - name: Build project
        run: dotnet build --configuration Release --no-restore

      # Step 5: Run tests
      - name: Run tests
        run: dotnet test --no-build --verbosity normal

      # Step 6: Publish project
      - name: Publish project
        run: dotnet publish -c Release -o published

      # Step 7: Build Docker Image
      - name: Build Docker image
        #run: docker build -t project1_withalibaba:dev .
        run: docker build -t project1_withalibaba:dev ./Project1_withAliBaba

        # Step 8: Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
        # Step 9: Tag Docker Image
      - name: Tag Docker image
        run: docker tag project1_withalibaba:dev ghcr.io/${{ github.repository_owner }}/project1_withalibaba:dev

        # Step 10: Push Docker Image to GHCR
      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/project1_withalibaba:dev
        
        
      # Step 8: Tag Docker Image for Alibaba Cloud Registry
      #- name: Tag Docker image for ACR
      #  run: docker tag project1_withalibaba:dev registry.cn-hangzhou.aliyuncs.com/<your-namespace>/project1_withalibaba:dev

