apiVersion: apps/v1
kind: Deployment
metadata:
  name: project1-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project1
  template:
    metadata:
      labels:
        app: project1
    spec:
      containers:
        - name: project1
          image: project1_withalibaba:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080